[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "~/.local/bin"
# Where to host releases
hosting = "github"
# Generate SHA-256 files alongside each release archive.
checksum = "sha256"
# Explicitly include only the release documentation and support files. This
# avoids ambiguity between Cargo's workspace-relative license path and dist's
# package-relative asset resolution.
auto-includes = false
source-tarball = false
# Generate a first-party curl | sh installer and GitHub artifact attestations.
github-attestations = true
# Keep the release archive useful for manual installations without adding
# source-checkout files or package-manager state.
include = ["README.md", "LICENSE", "CHANGELOG.md", "docs/orbis.1", "docs/completions/orbis.bash", "docs/completions/orbis.zsh", "docs/completions/orbis.fish"]
# Whether to install an updater program
install-updater = false
