[workspace]
members = ["crates/orbis-core", "crates/orbis-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Aritra Saha"]
repository = "https://github.com/iamaritrasaha/orbis"
homepage = "https://github.com/iamaritrasaha/orbis"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
wait-timeout = "0.2"
