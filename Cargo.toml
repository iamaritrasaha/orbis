[workspace]
members = ["crates/orbis-core", "crates/orbis-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0-beta.1.dev.13"
edition = "2024"
rust-version = "1.88"
license-file = "LICENSE"
authors = ["Aritra Saha"]
repository = "https://github.com/iamaritrasaha/orbis"
homepage = "https://github.com/iamaritrasaha/orbis"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive", "cargo"] }
semver = "1.0.28"
sha2 = "0.10.9"
tar = "0.4"
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
xz2 = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
wait-timeout = "0.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
unicode-width = "0.2.2"
orbis-core = { path = "crates/orbis-core", version = "0.1.0-beta.1.dev.13" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
